<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Nextspace" />
    <title>Nextspace</title>
    <style>
      #boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; background: #fff; transition: opacity .2s ease-out; }
      #boot.done { opacity: 0; pointer-events: none; }
      .boot-bar { position: relative; overflow: hidden; width: 120px; height: 3px; border-radius: 3px; background: #e8ecf2; }
      .boot-bar::after { content: ''; position: absolute; inset: 0; width: 40%; border-radius: 3px; background: #0b5cd5; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .boot-bar::after { animation: none; width: 100%; opacity: .4; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" role="status" aria-label="Loading Nextspace">
      <img src="/favicon.svg" width="72" height="72" alt="" />
      <span class="boot-bar"></span>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
